<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas Smiley Face</title>
</head>
<body>
<canvas id="myCanvas" width="600" height="620">
    Your browser does NOT support HTML5 Canvas, please update browser.
</canvas>

<script>
let canvas = document.getElementById("myCanvas");
let ctx = canvas.getContext("2d");

ctx.fillStyle = "#89e889";
ctx.fillRect(0,0, canvas.width, canvas.height);

ctx.beginPath();
ctx.arc(300, 280, 220, 0, Math.PI*2);
ctx.fillStyle = "#ffff00";
ctx.fill();
ctx.stroke();

ctx.beginPath();
ctx.arc(200, 240, 22, 0, Math.PI*2);
ctx.fillStyle="#000000";
ctx.fill();

ctx.beginPath();
ctx.arc(400, 240, 22, 0, Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.moveTo(300, 280);
ctx.lineTo(300,350);
ctx.stroke();

ctx.beginPath();
ctx.arc(300,300,120, 0.2*Math.PI, 0.8*Math.PI);
ctx.stroke();

ctx.font="bold 36px sans-serif";
ctx.fillStyle="#007000";
ctx.fillText("The Canvas brought me to life!", 25, 585);
</script>
</body>
</html>
