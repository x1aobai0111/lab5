<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF‑8">
    <title>LocalStorage Todo List</title>
</head>
<body>
    <input type="text" id="taskInput" placeholder="Input new task">
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList"></ul>

<script>
const input = document.getElementById("taskInput");
const ul = document.getElementById("taskList");

function getTaskArray(){
    let storedText = localStorage.getItem("todoList");
    if(storedText){
        return JSON.parse(storedText);
    }else{
        return [];
    }
}

function saveTaskArray(arr){
    localStorage.setItem("todoList", JSON.stringify(arr));
}

function renderTodoList(){
    ul.innerHTML = "";
    let tasks = getTaskArray();
    for(let i=0; i<tasks.length; i++){
        let liItem = document.createElement("li");
        liItem.textContent = tasks[i];
        ul.appendChild(liItem);
    }
}

function addTask(){
    let taskText = input.value.trim();
    if(taskText === "") return;

    let arr = getTaskArray();
    arr.push(taskText);
    saveTaskArray(arr);
    renderTodoList();
    input.value = "";
}

renderTodoList();
</script>
</body>
</html>
